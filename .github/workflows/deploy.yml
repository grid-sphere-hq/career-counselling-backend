name: Career Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/grid-sphere/career-counselling-backend

jobs:

  # ============================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  # ============================================================
  # JOB 2: DEPLOY TO VPS
  # ============================================================

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Starting Career Backend Deployment"
            echo "======================================"

            cd /root/career-ai

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Pulling new Docker image..."

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull

            echo "Starting updated container..."

            docker compose up -d

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"

            echo "Container status:"

            docker ps --filter "name=career-ai-backend"