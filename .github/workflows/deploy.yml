name: Career Counselling Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/grid-sphere/career-counselling-backend

jobs:

  # ============================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  # ============================================================
  # JOB 2: DEPLOY TO VPS
  # ============================================================

  deploy:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Starting Career Counselling Backend"
            echo "======================================"

            cd /root/career-counselling-backend

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Pulling new backend image..."

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull

            echo "New image pulled successfully."

            echo "Checking old backend..."

            if docker ps -q --filter "name=^career-ai-backend$" | grep -q .; then
              echo "Stopping old career-ai-backend..."

              docker stop career-ai-backend
            fi

            echo "Starting career-counselling-backend..."

            if docker compose up -d; then
              echo "New backend container started."
            else
              echo "New backend failed to start."
              echo "Starting old backend..."

              docker start career-ai-backend || true

              exit 1
            fi

            echo "Checking container status..."

            if docker ps -q --filter "name=^career-counselling-backend$" | grep -q .; then
              echo "career-counselling-backend is running."
            else
              echo "career-counselling-backend is NOT running."

              echo "Recent backend logs:"

              docker logs career-counselling-backend --tail 100 || true

              echo "Rolling back to old backend..."

              docker compose down || true
              docker start career-ai-backend || true

              exit 1
            fi

            echo "Waiting for backend to become ready..."

            for i in {1..30}; do

              if curl -fsS http://127.0.0.1:6767/docs > /dev/null; then
                echo "Backend health check passed."
                break
              fi

              echo "Backend not ready yet... attempt $i/30"

              sleep 5

              if [ "$i" -eq 30 ]; then
                echo "Backend failed to become ready."

                echo "Recent backend logs:"

                docker logs career-counselling-backend --tail 100 || true

                echo "Rolling back to old backend..."

                docker compose down || true
                docker start career-ai-backend || true

                exit 1
              fi

            done

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"

            echo "Container status:"

            docker ps --filter "name=career-counselling-backend"